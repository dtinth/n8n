name: 'Test: Linting'

on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to lint.
        required: false
        type: string
        default: ''
      nodeVersion:
        description: Version of node to use.
        required: false
        type: string
        default: 24.18.1

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest # spike: force vanilla GitHub runner (no RUNNER_PROVIDER var on fork)
    # spike: raise well above the ~13min mark where prior runs died with
    # "runner received a shutdown signal", to rule out a timeout as the cause.
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.ref }}

      # spike: diagnostics for the mystery mid-run cutoff — dump memory/swap/OOM
      # state every 15s so if it dies again we can see exactly what led up to it.
      - name: Start diagnostics heartbeat
        run: |
          (while true; do
            echo "=== heartbeat $(date -u +%FT%TZ) ==="
            free -h
            swapon --show 2>/dev/null || true
            dmesg 2>/dev/null | grep -iE 'killed process|out of memory' | tail -3 || true
            sleep 15
          done) &
          echo $! > /tmp/heartbeat.pid
        shell: bash

      - name: Build and Test
        uses: ./.github/actions/setup-nodejs
        with:
          # spike: scope to just nodes-base instead of the whole workspace (`pnpm
          # lint:ci`) — most of the ~13min before the cutoff was spent building/
          # linting ~30 unrelated packages, so nodes-base:lint never even started
          # in the last run. This reached it, but then failed on "Failed to find
          # methods to validate" — turbo's `lint` task only depends on `^build`
          # (dependencies' builds), not the package's own; in the full workspace
          # run nodes-base's own build gets pulled in incidentally as some other
          # package's `^build` dependency, which `--filter` scoping loses. Build
          # nodes-base explicitly too.
          build-command: pnpm turbo run build lint --filter=n8n-nodes-base --output-logs=full
          node-version: ${{ inputs.nodeVersion }}

      - name: Stop diagnostics heartbeat
        if: always()
        run: kill "$(cat /tmp/heartbeat.pid)" 2>/dev/null || true
        shell: bash
